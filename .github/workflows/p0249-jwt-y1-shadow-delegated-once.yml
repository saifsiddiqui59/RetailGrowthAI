name: "RetailGrowthAI #249 one-shot delegated Y1 signed JWT shadow dispatch"
# GitHub-only temporary trigger. Actual DEV workflow owns OIDC, exact settings
# allowlist, signed synthetic users, and independent rollback.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p0249-jwt-y1-shadow-delegated-once.yml"
permissions:
  contents: read
  actions: write
concurrency:
  group: p0249-jwt-y1-shadow-owner-delegation-once
  cancel-in-progress: false
jobs:
  dispatch:
    if: >-
      github.repository == 'saifsiddiqui59/RetailGrowthAI' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'ops(#249): launch bounded Y1 signed JWT shadow trial')
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify exact permanent DEV test and rollback sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:.github/workflows/p0249-dev-y1-public-shadow-bounded-once.yml)" = "282d3449a188926eb729f570e1d7df1245c40518"
          test "$(git rev-parse HEAD:ops/p0249_y1_public_shadow_trial_guard.py)" = "3b30c85411d9a81e93ea76256f5860f28acdef44"
          test "$(git rev-parse HEAD:tests/e2e/p0249_y1_signed_auth_shadow_once.py)" = "d697b173b2c407293da67c7438a999a2fbe085f1"
          test "$(git rev-parse HEAD:tests/e2e/p0249_dev_signed_jwt_read_once.py)" = "331d4d814b4073345668c415bf2459c89e333d0c"
          python3 -m unittest discover -s tests/infra -p 'test_p0249_jwt_shadow_delegated_once.py' -v
          echo "P0249_Y1_SIGNED_JWT_REVIEWED_SOURCE=PASS"
      - name: Require exact current main CI all four jobs before dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 105); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=40")"
            run_id="$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .name=="RetailGrowthAI Part 1 CI")] | sort_by(.created_at) | last | .id // empty' <<< "$runs")"
            if [[ -n "$run_id" ]]; then
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)"
              if [[ "$status" == "completed" ]]; then
                conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .conclusion)"
                test "$conclusion" = "success" || { echo "::error::Current main CI not green"; exit 2; }
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" | jq -e '
                  ["Python / uv + campaign contract tests",
                   "Frontend build + contract tests",
                   "FFmpeg codecs + renderer tests",
                   "Supabase isolation + authentication client tests"] as $expected |
                  [.jobs[] | select(.name as $name | $expected | index($name) != null)] as $required |
                  ($required | length) == 4 and all($required[]; .status == "completed" and .conclusion == "success")
                ' >/dev/null
                ready=true
                break
              fi
            fi
            sleep 10
          done
          test "$ready" = "true" || { echo "::error::Exact-main four-job CI not proven"; exit 2; }
          echo "P0249_Y1_SIGNED_JWT_DISPATCH_MAIN_CI=PASS_4OF4"
      - name: Dispatch one bounded protected DEV synthetic signed test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA" || { echo "::error::Main moved; deny stale JWT trial"; exit 2; }
          gh workflow run p0249-dev-y1-public-shadow-bounded-once.yml --ref main \
            -f confirm=YES-Y1-DEV-PUBLIC-SHADOW-BOUNDED
          echo "P0249_Y1_SIGNED_JWT_PROTECTED_SHADOW_DISPATCH=REQUESTED"
