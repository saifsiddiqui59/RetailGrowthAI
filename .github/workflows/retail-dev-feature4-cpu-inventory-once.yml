name: RetailGrowthAI F4 DEV read-only partial-host inventory
# Only inspects exact DEV resources after failed F4 initial deployment.
# No writes, retries, resource deletion, customer activation or token logging.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retail-dev-feature4-cpu-inventory-once.yml']
permissions:
  contents: read
concurrency:
  group: rgai-dev-feature4-cpu-inventory-once
  cancel-in-progress: false
jobs:
  classify-private-worker:
    if: github.repository == 'saifsiddiqui59/RetailGrowthAI' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      RG: rg-retailgrowth-dev
      APP: rgai-dev-f4cpu-d4e5ddbd
      PLAN: rgai-dev-f4cpu-plan
      STORAGE: rgaid4e5ddbdf0d21d96
      CONTAINER: retailgrowth-f4cpu-packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Login to existing protected DEV Azure identity
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate exact DEV RG and storage without exposing IDs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_SUBSCRIPTION_ID"
          test "$(az account show --query id -o tsv)" = "$AZURE_SUBSCRIPTION_ID"
          az group show -g "$RG" --subscription "$AZURE_SUBSCRIPTION_ID" -o json > "$RUNNER_TEMP/f4cpu-check-rg.json"
          az storage account show -g "$RG" -n "$STORAGE" --subscription "$AZURE_SUBSCRIPTION_ID" -o json > "$RUNNER_TEMP/f4cpu-check-storage.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          rg=json.loads((p/'f4cpu-check-rg.json').read_text())
          storage=json.loads((p/'f4cpu-check-storage.json').read_text())
          tags={str(k).lower():str(v).lower() for k,v in (rg.get('tags') or {}).items()}
          if (rg.get('name')!='rg-retailgrowth-dev' or rg.get('location')!='centralindia'
              or tags.get('app')!='retailgrowthai' or tags.get('environment')!='dev'):
              raise SystemExit('BLOCKED: incorrect DEV RG')
          scope=str(rg.get('id') or '').lower()
          if (not scope.endswith('/resourcegroups/rg-retailgrowth-dev')
              or not scope.startswith('/subscriptions/'+os.environ['AZURE_SUBSCRIPTION_ID'].lower()+'/')
              or str(storage.get('id') or '').lower()!=scope+'/providers/microsoft.storage/storageaccounts/rgaid4e5ddbdf0d21d96'):
              raise SystemExit('BLOCKED: DEV subscription/storage scope mismatch')
          print('PASS: exact DEV Azure scope; no writes')
          PY
      - name: Inventory target worker app, plan and private package container read-only
        shell: bash
        run: |
          set -euo pipefail
          az resource list -g "$RG" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-type Microsoft.Web/sites --query "[?name=='$APP']" -o json > "$RUNNER_TEMP/f4cpu-target-app-list.json"
          az resource list -g "$RG" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-type Microsoft.Web/serverfarms --query "[?name=='$PLAN']" -o json > "$RUNNER_TEMP/f4cpu-target-plan-list.json"
          az storage container exists --account-name "$STORAGE" --name "$CONTAINER" --auth-mode login \
            -o json > "$RUNNER_TEMP/f4cpu-target-container.json"
          if test "$(python3 -c 'import json,os,pathlib;print(len(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"f4cpu-target-app-list.json").read_text())))')" -eq 1; then
            az resource show -g "$RG" --name "$APP" --resource-type Microsoft.Web/sites \
              --api-version 2024-11-01 -o json > "$RUNNER_TEMP/f4cpu-target-app.json"
            az functionapp config appsettings list -g "$RG" -n "$APP" \
              -o json > "$RUNNER_TEMP/f4cpu-target-settings.json"
          else
            printf 'null' > "$RUNNER_TEMP/f4cpu-target-app.json"
            printf 'null' > "$RUNNER_TEMP/f4cpu-target-settings.json"
          fi
          if test "$(python3 -c 'import json,os,pathlib;print(len(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"f4cpu-target-plan-list.json").read_text())))')" -eq 1; then
            az resource show -g "$RG" --name "$PLAN" --resource-type Microsoft.Web/serverfarms \
              --api-version 2024-04-01 -o json > "$RUNNER_TEMP/f4cpu-target-plan.json"
          else
            printf 'null' > "$RUNNER_TEMP/f4cpu-target-plan.json"
          fi
      - name: Classify partial state by booleans only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          get=lambda filename:json.loads((p/filename).read_text())
          apps=get('f4cpu-target-app-list.json')
          plans=get('f4cpu-target-plan-list.json')
          container=get('f4cpu-target-container.json')
          app=get('f4cpu-target-app.json')
          plan=get('f4cpu-target-plan.json')
          settings=get('f4cpu-target-settings.json')
          if (not isinstance(apps,list) or len(apps)>1 or
              not isinstance(plans,list) or len(plans)>1 or
              not isinstance(container,dict) or type(container.get('exists')) is not bool):
              raise SystemExit('BLOCKED: ambiguous DEV inventory')
          scope=('/subscriptions/'+os.environ['AZURE_SUBSCRIPTION_ID'].lower()
                 +'/resourcegroups/rg-retailgrowth-dev')
          for record,expected,kind in (
              (app,scope+'/providers/microsoft.web/sites/rgai-dev-f4cpu-d4e5ddbd','APP'),
              (plan,scope+'/providers/microsoft.web/serverfarms/rgai-dev-f4cpu-plan','PLAN'),
          ):
              if record is not None:
                  tags={str(k).lower():str(v).lower() for k,v in (record.get('tags') or {}).items()}
                  if (str(record.get('id') or '').lower()!=expected or
                      tags.get('app')!='retailgrowthai' or tags.get('environment')!='dev' or
                      tags.get('purpose')!='feature4-cpu-private-worker'):
                      raise SystemExit('BLOCKED: unexpected DEV worker '+kind+' identity')
          if (bool(apps)!=(app is not None) or bool(plans)!=(plan is not None)):
              raise SystemExit('BLOCKED: inconsistent DEV worker inventory')
          if app is not None:
              cfg=((app.get('properties') or {}).get('functionAppConfig') or {})
              runtime=cfg.get('runtime') or {}
              scale=cfg.get('scaleAndConcurrency') or {}
              if (runtime.get('name')!='python' or runtime.get('version')!='3.11'
                  or scale.get('maximumInstanceCount')!=1 or scale.get('instanceMemoryMB')!=2048
                  or not isinstance(settings,list)):
                  raise SystemExit('BLOCKED: unknown F4 host configuration')
              flags={x.get('name'):x.get('value') for x in settings}
              if (str(flags.get('RETAIL_FEATURE4_CPU_WORKER_ENABLED','')).lower()!='false'
                  or str(flags.get('RETAIL_FEATURE4_CPU_RENDER_ENABLED','')).lower()!='false'
                  or 'RETAIL_SUPABASE_SERVICE_ROLE_KEY' in flags):
                  raise SystemExit('BLOCKED: F4 host flags or credentials unexpectedly active')
          if plan is not None:
              sku=plan.get('sku') or {}
              if sku.get('name')!='FC1' or sku.get('tier')!='FlexConsumption':
                  raise SystemExit('BLOCKED: unknown F4 worker plan SKU')
          status=('APP='+('present' if app is not None else 'absent')
                  +' PLAN='+('present' if plan is not None else 'absent')
                  +' CONTAINER='+('present' if container['exists'] else 'absent'))
          print('DEV F4 exact resource presence: '+status)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Read-only DEV F4 target inventory: '+status+'; no changes made.\n')
          PY
