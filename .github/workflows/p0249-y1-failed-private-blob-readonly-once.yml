name: "RetailGrowthAI #249 failed private Blob upload diagnosis (read only)"
# One-use owner-authorized post-failure investigation, no Azure writes.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p0249-y1-failed-private-blob-readonly-once.yml"
permissions:
  contents: read
concurrency:
  group: rgai-p0249-failed-private-blob-readonly-once
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      github.repository == 'saifsiddiqui59/RetailGrowthAI' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'ops(#249): inspect failed private Y1 Blob upload')
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RGAI_DEV_EXPECTED_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read-only original Y1 and failed unique private Blob existence
        shell: bash
        run: |
          set -euo pipefail
          python3 -u ops/p0249_y1_failed_private_blob_probe.py
      - name: End Azure OIDC
        if: always()
        run: az logout >/dev/null 2>&1 || true
