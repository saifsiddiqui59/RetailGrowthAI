name: RetailGrowthAI DEV one-time P0 249 warm vs post-idle check
# Existing DEV only, no user tokens, writes, config mutation, or paid capacity.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rgai-p0-249-warm-postidle
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'saifsiddiqui59/RetailGrowthAI' && github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate safety tests offline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/p0_249_cold_warm_http_probe.py tests/infra/test_p0_249_cold_warm_probe.py
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest -q tests/infra/test_p0_249_cold_warm_probe.py
      - uses: azure/login@v3
        with:
          client-id: \${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: \${{ secrets.AZURE_TENANT_ID }}
          subscription-id: \${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Six synthetic unauthenticated GETs with post-inactivity comparison
        shell: bash
        env:
          RGAI_DEV_EXPECTED_SUBSCRIPTION: \${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          python3 -u ops/p0_249_cold_warm_http_probe.py
      - name: End read-only session
        if: always()
        run: az logout >/dev/null 2>&1 || true
