name: RetailGrowthAI DEV Flex Functions hosting only (one-time)
# Owner waived budget/alerts. This stage intentionally provisions infrastructure
# but DOES NOT publish Python code, credentials or activate queue processing.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-dev-functions-hosting-once.yml'

permissions:
  contents: read
concurrency:
  group: rgai-dev-functions-hosting
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'saifsiddiqui59/RetailGrowthAI' && github.ref == 'refs/heads/main'
    name: First-release Central India Flex 2GiB, max one per group
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      RG: rg-retailgrowth-dev
      SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
      STORAGE: rgaid4e5ddbdf0d21d96
      APP: rgai-dev-functions-d4e5ddbd
      PLAN: rgai-dev-flex
      FRONTEND: https://purple-dune-06b5da200.2.azurestaticapps.net
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify dedicated DEV RG, preexisting private storage and app-name availability
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUB" && test -n "$CLIENT"
          test "$(az account show --query id -o tsv)" = "$SUB"
          az group show -g "$RG" -o json > "$RUNNER_TEMP/rg.json"
          az storage account show -g "$RG" -n "$STORAGE" -o json > "$RUNNER_TEMP/storage.json"
          python3 - "$RUNNER_TEMP/rg.json" "$RUNNER_TEMP/storage.json" "$RG" "$STORAGE" <<'PY'
          import json,sys
          rg=json.load(open(sys.argv[1]))
          acc=json.load(open(sys.argv[2]))
          tags={k.lower():str(v).lower() for k,v in (rg.get('tags') or {}).items()}
          assert rg['name']==sys.argv[3] and rg['location']=='centralindia'
          assert tags.get('app')=='retailgrowthai' and tags.get('environment')=='dev'
          assert acc['name']==sys.argv[4] and acc['location']=='centralindia'
          assert acc['kind']=='StorageV2' and acc['sku']['name']=='Standard_LRS'
          assert acc['allowBlobPublicAccess'] is False
          print('PASS: existing tagged RG and private storage exactly match RetailGrowthAI DEV')
          PY
          rgid="$(az group show -g "$RG" --query id -o tsv)"
          oid="$(az ad sp show --id "$CLIENT" --query id -o tsv)"
          az role assignment list --assignee-object-id "$oid" --scope "$rgid" --include-inherited -o json > "$RUNNER_TEMP/roles.json"
          python3 - "$RUNNER_TEMP/roles.json" "$rgid" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          s=sys.argv[2].lower()
          assert any(r.get('scope','').lower()==s and r.get('roleDefinitionName','').lower()=='contributor' for r in rows)
          assert all(r.get('roleDefinitionName','').lower()=='reader' for r in rows if r.get('scope','').lower()!=s)
          print('PASS: intended DEV RG-only Contributor')
          PY
          test -z "$(az resource list -g "$RG" --resource-type Microsoft.Web/sites --query '[].id' -o tsv)" || {
            echo "::error::BLOCKED: Function App already present; cannot overwrite"; exit 3;
          }
          test -z "$(az resource list -g "$RG" --resource-type Microsoft.Web/serverfarms --query '[].id' -o tsv)" || {
            echo "::error::BLOCKED: Hosting plan already present; cannot overwrite"; exit 3;
          }
          test "$(az functionapp list-consumption-locations --query "[?name=='Central India'].name | [0]" -o tsv 2>/dev/null || true)" != "__invalid__"
          echo "PASS: initial first release only, with no existing app or plan"

      - name: Read Azure ARM what-if and disallow existing-resource changes
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if -g "$RG" \
            --template-file infra/azure/function-host-dev.bicep \
            --parameters storageAccountName="$STORAGE" functionAppName="$APP" functionPlanName="$PLAN" frontendOrigin="$FRONTEND" \
            --no-pretty-print -o json > "$RUNNER_TEMP/whatif.json"
          python3 - "$RUNNER_TEMP/whatif.json" "$APP" "$PLAN" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          changes=d.get('changes') or (d.get('properties') or {}).get('changes') or []
          creations=[]
          for c in changes:
              action=c.get('changeType')
              if action=='Ignore':
                  continue
              rid=(c.get('resourceId') or '').lower()
              if action!='Create' or '/providers/microsoft.web/' not in rid:
                  raise SystemExit('BLOCKED: Unexpected ARM mutation to existing/non-Web resources: '+str(action))
              creations.append(rid)
          assert any(x.endswith('/sites/'+sys.argv[2].lower()) for x in creations), 'Function App not in create preview'
          assert any(x.endswith('/serverfarms/'+sys.argv[3].lower()) for x in creations), 'Flex plan not in create preview'
          print('PASS: Azure ARM preview creates only new dedicated Flex plan and Function App')
          PY

      - name: Provision new low-scale DEV Flex Functions hosting (no code deployment)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create -g "$RG" --name rgai-dev-flex-initial \
            --mode Incremental --template-file infra/azure/function-host-dev.bicep \
            --parameters storageAccountName="$STORAGE" functionAppName="$APP" functionPlanName="$PLAN" frontendOrigin="$FRONTEND" -o none
          echo "PASS: ARM hosting deployment finished; verifying actual properties"

      - name: Confirm actual Azure Flex resource, origin, and limited scale
        shell: bash
        run: |
          set -euo pipefail
          az resource show -g "$RG" -n "$APP" --resource-type Microsoft.Web/sites \
            --api-version 2024-11-01 -o json > "$RUNNER_TEMP/function.json"
          az resource show -g "$RG" -n "$PLAN" --resource-type Microsoft.Web/serverfarms \
            --api-version 2024-04-01 -o json > "$RUNNER_TEMP/plan.json"
          python3 - "$RUNNER_TEMP/function.json" "$RUNNER_TEMP/plan.json" "$APP" "$PLAN" "$FRONTEND" <<'PY'
          import json,sys
          site=json.load(open(sys.argv[1]))
          plan=json.load(open(sys.argv[2]))
          assert site.get('name')==sys.argv[3] and site.get('location')=='centralindia'
          assert plan.get('name')==sys.argv[4] and plan.get('location')=='centralindia'
          sku=plan.get('sku') or {}
          assert sku.get('name')=='FC1' and sku.get('tier')=='FlexConsumption'
          cfg=(site.get('properties') or {}).get('functionAppConfig') or {}
          rt=cfg.get('runtime') or {}
          scale=cfg.get('scaleAndConcurrency') or {}
          assert rt.get('name')=='python' and rt.get('version')=='3.12'
          assert scale.get('instanceMemoryMB')==2048
          assert scale.get('maximumInstanceCount')==1
          print('PASS: actual Azure Flex Consumption Python 3.12, 2GiB, max one instance per function group')
          print('FUNCTION_HOST_CREATED:',sys.argv[3])
          print('CODE_STATUS: not deployed; requires signed/validated ZIP and private Supabase app credentials')
          PY
          echo "NOTE: no budget alerts by explicit owner choice; workload usage can incur charges"

      - name: Logout
        if: always()
        run: az logout >/dev/null 2>&1 || true
