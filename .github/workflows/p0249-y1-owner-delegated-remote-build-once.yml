name: "RetailGrowthAI #249 one-shot owner-authorized Y1 remote-build launch"
# Created only on explicit 2026-11-20 owner authorization. This bridge makes
# no cloud call; the protected DEV workflow alone can modify the exact Y1.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p0249-y1-owner-delegated-remote-build-once.yml"
permissions:
  contents: read
  actions: write
concurrency:
  group: rgai-p0249-owner-delegated-remote-build-once
  cancel-in-progress: false
jobs:
  dispatch:
    if: >-
      github.repository == 'saifsiddiqui59/RetailGrowthAI' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'ops(#249): owner-delegated Y1 remote-build release')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify approved secure source and release code are unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          verify_blob() { test "$(git rev-parse "HEAD:$1")" = "$2"; }
          verify_blob .github/workflows/p0249-dev-y1-five-get-remote-build-protected.yml e65de907fff0c0d772d09029203655c207e46679
          verify_blob ops/p0249_y1_remote_build_mode.py de270238e120d03e12418cb04e1b8ab5da53a749
          verify_blob ops/p0249-y1-readonly-extra-get/build_five_get_release.py b6cc730a0bce59093e831965ca4ee1f817121203
          verify_blob azure-functions/campaign-api/tenant_store.py d5091e4cf14071473813b77226c2a5ad61b84635
          verify_blob tests/infra/test_p0249_y1_remote_build_mode.py 533d026de401a14558134901c1d46ead5278570d
          echo "P0249_OWNER_REMOTE_BUILD_PINNED_SOURCES=PASS"
      - name: Require all four Part1 CI jobs on this exact main SHA
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          accepted=false
          for attempt in $(seq 1 78); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=40")"
            run_id="$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .name=="RetailGrowthAI Part 1 CI")] | sort_by(.created_at) | last | .id // empty' <<< "$runs")"
            if [ -n "$run_id" ]; then
              state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)"
              if [ "$state" = "completed" ]; then
                outcome="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .conclusion)"
                test "$outcome" = "success" || { echo "::error::Exact main CI failed"; exit 2; }
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" | jq -e '
                  [.jobs[] | select(
                    .name == "Python / uv + campaign contract tests" or
                    .name == "Supabase isolation + authentication client tests" or
                    .name == "Frontend build + contract tests" or
                    .name == "FFmpeg codecs + renderer tests"
                  ) | .conclusion] | length == 4 and all(.[]; . == "success")
                ' >/dev/null
                accepted=true
                echo "P0249_OWNER_REMOTE_BUILD_EXACT_MAIN_CI_4OF4=PASS"
                break
              fi
            fi
            sleep 15
          done
          test "$accepted" = "true" || { echo "::error::Exact-main CI timed out"; exit 2; }
      - name: Dispatch protected Y1 DEV remote-build once using exact reviewed main
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          test "$current" = "$GITHUB_SHA" || { echo "::error::Main advanced; refuse dispatch"; exit 2; }
          prior="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100")"
          duplicate="$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .name=="RetailGrowthAI #249 Y1 corrected remote-build DEV release (protected + rollback)")] | length' <<< "$prior")"
          test "$duplicate" = "0" || { echo "::error::Already dispatched for this main SHA"; exit 2; }
          jq -nc --arg sha "$GITHUB_SHA" '{ref:"main",inputs:{confirm:"YES-P0249-DEV-Y1-REMOTE-BUILD-ROLLBACK",reviewed_main_sha:$sha}}' |
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/p0249-dev-y1-five-get-remote-build-protected.yml/dispatches" --input -
          echo "P0249_PROTECTED_Y1_REMOTE_BUILD=DISPATCH_REQUESTED"
          echo "Protected dev environment, original Flex/Y1 scope, same-run and independent rollback remain enforced."
