name: RetailGrowthAI DEV existing SWA protected Platform Control UI release (one time)
# Owner-authorized existing DEV SWA FRONTEND-ONLY release. Root backend migration/grant require verified account and separate gate.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retail-dev-swa-subscription-once.yml'
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository == 'saifsiddiqui59/RetailGrowthAI' && github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build and test explicit real-model, public-only frontend
        working-directory: frontend
        shell: bash
        env:
          VITE_CAMPAIGN_GENERATION_MODE: foundry
        run: |
          set -euo pipefail
          grep -Fxq 'VITE_SUPABASE_URL=https://jeearzffnjbvghwjjjrf.supabase.co' .env.production
          grep -Fxq 'VITE_CAMPAIGN_API_BASE_URL=https://rgai-dev-functions-d4e5ddbd.azurewebsites.net' .env.production
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm test
          npm run build
          test -s dist/index.html
          test -s dist/staticwebapp.config.json
          if grep -REq 'sb_secret_|RETAIL_SUPABASE_SERVICE_ROLE_KEY|RETAIL_FOUNDRY_API_KEY' dist; then
            echo "::error::Privileged setting in frontend build"
            exit 3
          fi
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Audit exact existing RetailGrowthAI DEV RG and Free SWA
        shell: bash
        env:
          AZ_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$AZ_SUB"
          az group show -n rg-retailgrowth-dev -o json > "$RUNNER_TEMP/rg.json"
          python3 - "$RUNNER_TEMP/rg.json" <<'PY'
          import json,sys
          o=json.load(open(sys.argv[1]))
          tags={k.lower():str(v).lower() for k,v in (o.get('tags') or {}).items()}
          assert o['name']=='rg-retailgrowth-dev'
          assert tags.get('app')=='retailgrowthai' and tags.get('environment')=='dev'
          PY
          az staticwebapp show -g rg-retailgrowth-dev -n retailgrowthai-dev-preview -o json > "$RUNNER_TEMP/site.json"
          python3 - "$RUNNER_TEMP/site.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          assert s['name']=='retailgrowthai-dev-preview'
          assert (s.get('sku') or {}).get('name','').lower()=='free'
          assert s['defaultHostname'].endswith('.azurestaticapps.net')
          PY
      - name: Fetch masked ephemeral deployment token for exact existing SWA
        id: token
        shell: bash
        run: |
          set -euo pipefail
          t="$(az staticwebapp secrets list -g rg-retailgrowth-dev -n retailgrowthai-dev-preview --query 'properties.apiKey' -o tsv)"
          test -n "$t"
          echo "::add-mask::$t"
          echo "token=$t" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        env:
          VITE_CAMPAIGN_GENERATION_MODE: foundry
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: frontend
          api_location: ''
          output_location: dist
          app_build_command: npm run build
          production_branch: main
      - name: Verify real DEV SPA endpoints
        shell: bash
        run: |
          set -euo pipefail
          host="$(az staticwebapp show -g rg-retailgrowth-dev -n retailgrowthai-dev-preview --query defaultHostname -o tsv)"
          for path in '' campaigns account subscription platform-admin; do
            curl -fsSL --max-time 25 "https://$host/$path" -o "$RUNNER_TEMP/page"
            grep -Fq 'id="root"' "$RUNNER_TEMP/page"
          done
          echo "PASS: DEV SWA SPA /, /campaigns, /account, /subscription, /platform-admin deployed; protected admin route requires signed-in verified root https://$host"
      - name: Azure logout
        if: always()
        run: az logout >/dev/null 2>&1 || true
