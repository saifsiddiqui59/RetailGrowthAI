name: RetailGrowthAI DEV post-ZIP Functions and queue health (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retail-dev-postzip-verify-once.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'saifsiddiqui59/RetailGrowthAI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check exact tagged DEV RG and indexed worker functions
        shell: bash
        env:
          AZ_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          rg=rg-retailgrowth-dev
          fn=rgai-dev-functions-d4e5ddbd
          test "$(az account show --query id -o tsv)" = "$AZ_SUB"
          az group show -n "$rg" -o json > "$RUNNER_TEMP/rg.json"
          python3 - "$RUNNER_TEMP/rg.json" <<'PY'
          import json,sys
          o=json.load(open(sys.argv[1]))
          tags={k.lower():str(v).lower() for k,v in (o.get('tags') or {}).items()}
          assert o['name']=='rg-retailgrowth-dev'
          assert tags.get('app')=='retailgrowthai' and tags.get('environment')=='dev'
          PY
          test "$(az functionapp show -g "$rg" -n "$fn" --query name -o tsv)" = "$fn"
          az functionapp function list -g "$rg" -n "$fn" -o json > "$RUNNER_TEMP/functions.json"
          python3 - "$RUNNER_TEMP/functions.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          names={f.get('name','').split('/')[-1] for f in data}
          required={'plan_campaign','render_campaign_reel','recover_stale_jobs',
            'create_campaign','read_campaign','save_campaign_day',
            'create_render','get_render','get_render_download',
            'planning_poison','render_poison'}
          print('INDEXED',len(names),'MISSING',sorted(required-names))
          assert required<=names
          for f in data:
            n=f.get('name','').split('/')[-1]
            if n in ('plan_campaign','render_campaign_reel','recover_stale_jobs'):
              print('WORKER',n,'disabled',f.get('isDisabled'))
              assert f.get('isDisabled') is not True
          PY
      - name: Bounded repeat HTTP unauthorized 401 probe (never sends JWT)
        shell: bash
        run: |
          set -euo pipefail
          host=https://rgai-dev-functions-d4e5ddbd.azurewebsites.net
          for i in $(seq 1 7); do
            status="$(curl -sS --connect-timeout 12 --max-time 30 \
              -o /dev/null -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' -d '{}' \
              "$host/api/campaigns")" && rc=0 || rc=$?
            echo "DEV_HTTP_PROBE attempt=$i result=$status transport_rc=$rc"
            if [ "$status" = "401" ] && [ "$rc" = 0 ]; then
              echo 'PASS API 401 after supported warmup'
              exit 0
            fi
            if [ "$status" != "000" ] && [ "$status" != "502" ] \
               && [ "$status" != "503" ] && [ "$status" != "504" ]; then
              echo "::error::Unexpected API status (expected authenticated boundary 401)"
              exit 3
            fi
            test "$i" -lt 7
            sleep 12
          done
          echo "::error::DEV API did not return 401; retry is bounded"
          exit 3
      - name: Inspect only approximate queue counts using existing runtime connection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q 'azure-storage-queue==12.12.0'
          connection="$(az functionapp config appsettings list -g rg-retailgrowth-dev \
            -n rgai-dev-functions-d4e5ddbd \
            --query "[?name=='RETAIL_STORAGE'].value | [0]" -o tsv)"
          test -n "$connection"
          echo "::add-mask::$connection"
          RGAI_RUNTIME_STORAGE="$connection" python3 - <<'PY'
          import os
          from azure.storage.queue import QueueServiceClient
          from azure.core.exceptions import ResourceNotFoundError, HttpResponseError
          connection=os.environ['RGAI_RUNTIME_STORAGE']
          cfg=dict(x.split('=',1) for x in connection.split(';') if '=' in x)
          assert cfg.get('AccountName')=='rgaid4e5ddbdf0d21d96'
          client=QueueServiceClient.from_connection_string(connection)
          for name in ('retail-campaign-planning','retail-reel-render',
                       'retail-campaign-planning-poison','retail-reel-render-poison'):
            try:
              props=client.get_queue_client(name).get_queue_properties()
              print('QUEUE_METADATA',name,'approximate_count',props.approximate_message_count)
            except (ResourceNotFoundError,HttpResponseError) as exc:
              print('QUEUE_METADATA',name,'not readable (no messages read)')
              raise RuntimeError('Queue metadata not accessible') from None
          PY
      - name: Clear Azure session
        if: always()
        run: az logout >/dev/null 2>&1 || true
