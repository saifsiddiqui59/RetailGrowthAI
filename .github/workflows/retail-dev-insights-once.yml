name: RetailGrowthAI DEV application traces and 30-day Log Analytics
# Owner authorized tracing inspired by WineShopPOS. Separate RG; no shared monitoring.
on:
  push:
    branches: [main]
    paths: [.github/workflows/retail-dev-insights-once.yml]
permissions:
  contents: read
concurrency:
  group: rgai-dev-private-insights
  cancel-in-progress: false
jobs:
  telemetry:
    if: github.repository == 'saifsiddiqui59/RetailGrowthAI' && github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    env:
      RG: rg-retailgrowth-dev
      AZ_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      APP: rgai-dev-functions-d4e5ddbd
      WORKSPACE: rgai-dev-law
      INSIGHTS: rgai-dev-appinsights
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify exact DEV scope, existing Function and no inherited write
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$AZ_SUB"
          az group show -g "$RG" -o json > "$RUNNER_TEMP/rg.json"
          python3 - "$RUNNER_TEMP/rg.json" <<'PY'
          import json,sys
          o=json.load(open(sys.argv[1]))
          t={k.lower():str(v).lower() for k,v in (o.get('tags') or {}).items()}
          assert o['name']=='rg-retailgrowth-dev'
          assert o['location'].replace(' ','').lower()=='centralindia'
          assert t.get('app')=='retailgrowthai' and t.get('environment')=='dev'
          PY
          test "$(az functionapp show -g "$RG" -n "$APP" --query name -o tsv)" = "$APP"
          rgid="$(az group show -g "$RG" --query id -o tsv)"
          sp="$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)"
          az role assignment list --assignee-object-id "$sp" --scope "$rgid" --include-inherited -o json > "$RUNNER_TEMP/roles.json"
          python3 - "$RUNNER_TEMP/roles.json" "$rgid" <<'PY'
          import json,sys
          rs=json.load(open(sys.argv[1])); scope=sys.argv[2].lower()
          assert any(x.get('scope','').lower()==scope and x.get('roleDefinitionName','').lower()=='contributor' for x in rs)
          assert all(x.get('roleDefinitionName','').lower()=='reader' for x in rs if x.get('scope','').lower()!=scope)
          PY
      - name: Create only dedicated DEV log workspace, pay-per-ingested-GB, 30-day retention
        shell: bash
        run: |
          set -euo pipefail
          if ! az monitor log-analytics workspace show -g "$RG" -n "$WORKSPACE" -o json > "$RUNNER_TEMP/law.json" 2>/dev/null; then
            az monitor log-analytics workspace create -g "$RG" -n "$WORKSPACE" \
              --location centralindia --sku PerGB2018 --retention-time 30 \
              --tags app=RetailGrowthAI environment=dev purpose=ai-traces -o none
          fi
          az monitor log-analytics workspace show -g "$RG" -n "$WORKSPACE" -o json > "$RUNNER_TEMP/law.json"
          python3 - "$RUNNER_TEMP/law.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['name']=='rgai-dev-law'
          assert j['location'].replace(' ','').lower()=='centralindia'
          assert j.get('retentionInDays',30)<=30
          print('PASS: RetailGrowthAI-only 30-day workspace')
          PY
      - name: Create only dedicated workspace-based Application Insights
        shell: bash
        run: |
          set -euo pipefail
          wid="$(az monitor log-analytics workspace show -g "$RG" -n "$WORKSPACE" --query id -o tsv)"
          test -n "$wid"
          if ! az monitor app-insights component show -g "$RG" --app "$INSIGHTS" -o json > "$RUNNER_TEMP/insights.json" 2>/dev/null; then
            az monitor app-insights component create --app "$INSIGHTS" -g "$RG" \
              --location centralindia --kind web --application-type web \
              --workspace "$wid" -o none
          fi
          az monitor app-insights component show -g "$RG" --app "$INSIGHTS" -o json > "$RUNNER_TEMP/insights.json"
          python3 - "$RUNNER_TEMP/insights.json" "$wid" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['name']=='rgai-dev-appinsights'
          assert j['workspaceResourceId'].lower()==sys.argv[2].lower()
          print('PASS: dedicated workspace-based Application Insights')
          PY
      - name: Configure existing Functions host telemetry without exposing connection values
        shell: bash
        run: |
          set -euo pipefail
          connection="$(az monitor app-insights component show -g "$RG" --app "$INSIGHTS" --query connectionString -o tsv)"
          test -n "$connection"
          echo "::add-mask::$connection"
          az functionapp config appsettings set -g "$RG" -n "$APP" -o none --settings \
            "APPLICATIONINSIGHTS_CONNECTION_STRING=$connection" \
            "APPINSIGHTS_INSTRUMENTATIONKEY="
          az functionapp config appsettings list -g "$RG" -n "$APP" --query '[].name' -o tsv > "$RUNNER_TEMP/settings"
          grep -Fxq APPLICATIONINSIGHTS_CONNECTION_STRING "$RUNNER_TEMP/settings"
          echo 'PASS: existing DEV Functions host wired to dedicated Application Insights.'
          echo 'Telemetry ingestion still requires fresh request + workspace query proof.'
      - name: Publish trace-instrumented source with the existing pinned static FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/deploy/package.py --check
          mkdir -p "$RUNNER_TEMP/media" "$RUNNER_TEMP/release"
          image='mwader/static-ffmpeg@sha256:f5d100184884eb3e82b0eb14bb5ebf98da99826ac824989720297fb9ef21c822'
          docker pull "$image"
          cid="$(docker create "$image" -version)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/ffmpeg" "$RUNNER_TEMP/media/ffmpeg"
          docker cp "$cid:/ffprobe" "$RUNNER_TEMP/media/ffprobe"
          chmod 755 "$RUNNER_TEMP/media/ffmpeg" "$RUNNER_TEMP/media/ffprobe"
          cat > "$RUNNER_TEMP/media/THIRD_PARTY_NOTICES.txt" <<'NOTICE'
          FFmpeg and ffprobe: GPL static Linux amd64, libx264/AAC.
          Versioned corresponding source and build instructions: https://github.com/wader/static-ffmpeg
          FFmpeg license terms: https://ffmpeg.org/legal.html
          OCI image digest: sha256:f5d100184884eb3e82b0eb14bb5ebf98da99826ac824989720297fb9ef21c822
          NOTICE
          python3 scripts/deploy/package.py --ffmpeg-dir "$RUNNER_TEMP/media" \
            --output "$RUNNER_TEMP/release/traces.zip"
          python3 scripts/deploy/package.py --verify-zip "$RUNNER_TEMP/release/traces.zip"
          az functionapp deployment source config-zip -g "$RG" -n "$APP" \
            --src "$RUNNER_TEMP/release/traces.zip" --build-remote true -o none
          az functionapp function list -g "$RG" -n "$APP" -o json > "$RUNNER_TEMP/functions.json"
          python3 - "$RUNNER_TEMP/functions.json" <<'PY'
          import json,sys
          names={x.get('name','').split('/')[-1] for x in json.load(open(sys.argv[1]))}
          required={'create_campaign','read_campaign','plan_campaign','render_campaign_reel',
                    'planning_poison','render_poison','recover_stale_jobs',
                    'get_render','get_render_download','create_render','save_campaign_day'}
          assert required<=names, sorted(required-names)
          print('PASS: trace-instrumented code published and all 11 Functions indexed')
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build tested frontend with actual configured backend mode
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          [ -f package-lock.json ] && npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm test
          mode="$(az functionapp config appsettings list -g "$RG" -n "$APP" \
            --query "[?name=='RETAIL_ENABLE_MOCK_CAMPAIGNS'].value | [0]" -o tsv)"
          if [ "$mode" = 'false' ]; then
            echo 'VITE_CAMPAIGN_GENERATION_MODE=foundry' >> "$GITHUB_ENV"
            echo 'PASS: frontend built for independently confirmed real Foundry mode'
          else
            echo 'VITE_CAMPAIGN_GENERATION_MODE=mock' >> "$GITHUB_ENV"
            echo 'DEV MOCK remains clearly labeled; no false live AI claim'
          fi
          npm run build
          test -s dist/index.html
          if grep -REq 'sb_secret_|RETAIL_FOUNDRY_API_KEY|RETAIL_SUPABASE_SERVICE_ROLE_KEY' dist; then
            echo 'BLOCKED: privileged key marker in public JS'; exit 3
          fi
      - name: Fetch temporary existing Free SWA deployment token (not logged)
        id: swa-token
        shell: bash
        run: |
          set -euo pipefail
          site="$(az staticwebapp show -g "$RG" -n retailgrowthai-dev-preview --query name -o tsv)"
          test "$site" = retailgrowthai-dev-preview
          token="$(az staticwebapp secrets list -g "$RG" \
            -n retailgrowthai-dev-preview --query properties.apiKey -o tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        env:
          VITE_CAMPAIGN_GENERATION_MODE: ${{ env.VITE_CAMPAIGN_GENERATION_MODE }}
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: frontend
          api_location: ''
          output_location: dist
          app_build_command: npm run build
          production_branch: main
      - name: Verify all three public Azure DEV pages
        shell: bash
        run: |
          set -euo pipefail
          host="$(az staticwebapp show -g "$RG" -n retailgrowthai-dev-preview --query defaultHostname -o tsv)"
          case "$host" in *.azurestaticapps.net) ;; *) exit 3 ;; esac
          for p in '' campaigns account; do
            curl -fsSL --max-time 25 "https://$host/$p" -o "$RUNNER_TEMP/page.html"
            grep -Fq 'id="root"' "$RUNNER_TEMP/page.html"
          done
          echo "PASS: Azure frontend re-published; actual https://$host"
      - name: Create one safe unauthorized probe for correlation, no tenant data
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            "https://$APP.azurewebsites.net/api/campaigns")"
          test "$code" = 401
          echo 'PASS: telemetry probe returned unauthenticated 401 (no user data)'
      - name: Close Azure session
        if: always()
        run: az logout >/dev/null 2>&1 || true
