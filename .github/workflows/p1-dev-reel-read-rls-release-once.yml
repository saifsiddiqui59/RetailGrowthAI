name: RetailGrowthAI DEV existing Free SWA private Reel status/download RLS read release
# One-shot owner-authorized existing tagged DEV Free SWA only.
# Publish source-merged PR #284 after four CI jobs: tenant JWT RLS
# read-only fallback for Reel status/private signed downloads after 503.
# Do not provision resources, touch Functions, tenant DB, email or Parts 2/3.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p1-dev-reel-read-rls-release-once.yml'
permissions:
  contents: read
jobs:
  deploy:
    if: >-
      github.repository == 'saifsiddiqui59/RetailGrowthAI' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release(dev): RetailGrowthAI signed Reel reads via tenant RLS')
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify Part 1 admin/mobile source, tests and public-only frontend
        working-directory: frontend
        shell: bash
        env:
          VITE_CAMPAIGN_GENERATION_MODE: foundry
        run: |
          set -euo pipefail
          grep -Fxq 'VITE_SUPABASE_URL=https://jeearzffnjbvghwjjjrf.supabase.co' .env.production
          grep -Fxq 'VITE_CAMPAIGN_API_BASE_URL=https://rgai-dev-functions-d4e5ddbd.azurewebsites.net' .env.production
          # Actual reviewed source must contain bounded GET-only recovery.
          grep -Fq 'const READ_TIMEOUT_MS = 12000' src/features/campaigns/campaign-api.mjs
          grep -Fq 'const READ_ATTEMPTS = 2' src/features/campaigns/campaign-api.mjs
          grep -Fq "const attempts = method === 'GET' ? READ_ATTEMPTS : 1" src/features/campaigns/campaign-api.mjs
          # Only current-user JWT and public publishable key can be used.
          test -f src/features/campaigns/reel-rls-fallback.mjs
          test -f ../tests/frontend/reel-rls-fallback.test.mjs
          grep -Fq 'const statusFallback = createRenderReadFallback' src/features/campaigns/campaign-api.mjs
          grep -Fq 'createRenderReadFallback({' src/features/campaigns/campaign-api.mjs
          grep -Fq "if (error?.status !== 503 || !statusFallback) throw error" src/features/campaigns/campaign-api.mjs
          grep -Fq "if (error?.status !== 503 || !statusFallback) throw error" src/features/campaigns/campaign-api.mjs
          grep -Fq 'const token=await tokenProvider()' src/features/campaigns/reel-rls-fallback.mjs
          grep -Fq "const BUCKET='retailgrowth-media'" src/features/campaigns/reel-rls-fallback.mjs
          grep -Fq "'/rest/v1/render_jobs?'" src/features/campaigns/reel-rls-fallback.mjs
          grep -Fq "'/rest/v1/media_assets?'" src/features/campaigns/reel-rls-fallback.mjs
          grep -Fq "expiresIn:60" src/features/campaigns/reel-rls-fallback.mjs
          grep -Eq '^VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_[A-Za-z0-9_]+' .env.production
          node --test ../tests/frontend/reel-rls-fallback.test.mjs
          test -f ../tests/frontend/campaign-read-retry.test.mjs
          test -f e2e/login-responsive.spec.mjs
          test -f src/features/platform/PlatformAlerts.jsx
          test -f src/features/platform/SubscriptionHealthPanel.jsx
          grep -Fq "'/platform-alerts'" src/App.jsx
          grep -Fq 'platform-alert-signals' ../tests/frontend/platform-alert-signals.test.mjs || test -f ../tests/frontend/platform-alert-signals.test.mjs
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm test
          npm run build
          test -s dist/index.html
          test -s dist/staticwebapp.config.json
          if grep -REq 'sb_secret_|RETAIL_SUPABASE_SERVICE_ROLE_KEY|RETAIL_FOUNDRY_API_KEY' dist; then
            echo "::error::Privileged setting in frontend build"
            exit 3
          fi
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Audit exact existing RetailGrowthAI DEV RG and Free SWA
        shell: bash
        env:
          AZ_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$AZ_SUB"
          az group show -n rg-retailgrowth-dev -o json > "$RUNNER_TEMP/rg.json"
          python3 - "$RUNNER_TEMP/rg.json" <<'PY'
          import json,sys
          o=json.load(open(sys.argv[1]))
          tags={k.lower():str(v).lower() for k,v in (o.get('tags') or {}).items()}
          assert o['name']=='rg-retailgrowth-dev'
          assert tags.get('app')=='retailgrowthai' and tags.get('environment')=='dev'
          PY
          az staticwebapp show -g rg-retailgrowth-dev -n retailgrowthai-dev-preview -o json > "$RUNNER_TEMP/site.json"
          python3 - "$RUNNER_TEMP/site.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          assert s['name']=='retailgrowthai-dev-preview'
          assert (s.get('sku') or {}).get('name','').lower()=='free'
          assert s['defaultHostname']=='purple-dune-06b5da200.2.azurestaticapps.net'
          PY
      - name: Fetch masked ephemeral deployment token for exact existing SWA
        id: token
        shell: bash
        run: |
          set -euo pipefail
          t="$(az staticwebapp secrets list -g rg-retailgrowth-dev -n retailgrowthai-dev-preview --query 'properties.apiKey' -o tsv)"
          test -n "$t"
          echo "::add-mask::$t"
          echo "token=$t" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        env:
          VITE_CAMPAIGN_GENERATION_MODE: foundry
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: frontend
          api_location: ''
          output_location: dist
          app_build_command: npm run build
          production_branch: main
      - name: Verify real DEV SPA endpoints
        shell: bash
        run: |
          set -euo pipefail
          host="$(az staticwebapp show -g rg-retailgrowth-dev -n retailgrowthai-dev-preview --query defaultHostname -o tsv)"
          for path in '' account campaigns business subscription platform-admin platform-alerts; do
            curl -fsSL --max-time 25 "https://$host/$path" -o "$RUNNER_TEMP/page"
            grep -Fq 'id="root"' "$RUNNER_TEMP/page"
          done
          # Inspect the actual CSS returned by Azure, not just the deployment response.
          curl -fsSL --max-time 25 "https://$host/account" -o "$RUNNER_TEMP/account.html"
          asset="$(grep -oE 'href="/assets/[^"]+\.css"' "$RUNNER_TEMP/account.html" | head -1 | cut -d'"' -f2)"
          test -n "$asset"
          curl -fsSL --max-time 25 "https://$host$asset" -o "$RUNNER_TEMP/live.css"
          grep -Fq 'login-form-side' "$RUNNER_TEMP/live.css"
          grep -Fq '#edf5f2' "$RUNNER_TEMP/live.css"
          grep -Fq 'platform-alert' "$RUNNER_TEMP/live.css"
          # Verify the live Vite JS, not only a green deployment response.
          curl -fsSL --max-time 25 "https://$host/" -o "$RUNNER_TEMP/live-index.html"
          js="$(grep -oE 'src="/assets/[^"]+[.]js"' "$RUNNER_TEMP/live-index.html" | head -1 | cut -d'"' -f2)"
          test -n "$js"
          curl -fsSL --max-time 30 "https://$host$js" -o "$RUNNER_TEMP/live-frontend.js"
          grep -Fq 'Campaign service is temporarily unavailable. Try again.' "$RUNNER_TEMP/live-frontend.js"
          grep -Fq 'Private video status is temporarily unavailable. Please retry.' "$RUNNER_TEMP/live-frontend.js"
          grep -Fq 'Video output is not ready' "$RUNNER_TEMP/live-frontend.js"
          grep -Fq '/rest/v1/render_jobs?' "$RUNNER_TEMP/live-frontend.js"
          grep -Fq '/rest/v1/media_assets?' "$RUNNER_TEMP/live-frontend.js"
          grep -Fq 'retailgrowth-media' "$RUNNER_TEMP/live-frontend.js"
          echo "DEV_PRIVATE_REEL_RLS_READ_FALLBACK_JS_LIVE=true"
          echo "DEV_SAFE_GET_RETRY_ASSET_LIVE=true"
          echo "PASS: existing Free DEV SWA serves reviewed tenant-JWT private video status/download fallback"
          echo "NOTE: original Azure HTTP 503 #249 remains OPEN; no signed-in retailer full E2E claimed."
      - name: Azure logout
        if: always()
        run: az logout >/dev/null 2>&1 || true
