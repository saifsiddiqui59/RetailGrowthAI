name: RetailGrowthAI #249 isolated DEV Y1 Consumption HTTP canary (one-time)
# Original Flex API, PROD, WineShopPOS, queues and customer secrets are untouched.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0249-dev-y1-isolated-canary-once.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: "Only one new Central India DEV Linux Y1 canary and plan"
        required: true
        type: choice
        options: ['NO', 'YES-P0249-ISOLATED-Y1']
permissions:
  contents: read
concurrency:
  group: rgai-p0249-isolated-dev-classic-y1
  cancel-in-progress: false
jobs:
  provision-and-probe:
    if: >-
      github.repository == 'saifsiddiqui59/RetailGrowthAI' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirm == 'YES-P0249-ISOLATED-Y1') ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ops(#249): create isolated DEV classic Y1 HTTP canary')))
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      RGAI_DEV_EXPECTED_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Offline safety regressions before any Azure authentication
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/p0249_y1_canary_guard.py ops/p0249-y1-canary/function_app.py
          python3 -m unittest discover -s tests/infra -p 'test_p0249_y1_canary.py' -v
          test -f infra/azure/p0249-classic-y1-dev-canary.bicep
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify exact DEV identity, absence of canary resources and ARM create-only preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -u ops/p0249_y1_canary_guard.py preflight
      - name: Provision only new Y1 Linux Python site and plan into existing DEV RG
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create -g rg-retailgrowth-dev \
            --name p0249-dev-isolated-y1-canary \
            --mode Incremental \
            --template-file infra/azure/p0249-classic-y1-dev-canary.bicep -o none
      - name: Verify new exact Y1 SKU, tags, runtime and preserved original FC1 plan
        shell: bash
        run: |
          set -euo pipefail
          python3 -u ops/p0249_y1_canary_guard.py verify
      - name: Build and deploy ONLY HTTP canary ZIP by remote Linux Python build
        shell: bash
        run: |
          set -euo pipefail
          (cd ops/p0249-y1-canary && zip -q "$RUNNER_TEMP/p0249-y1-canary.zip" function_app.py host.json requirements.txt)
          az functionapp deployment source config-zip \
            -g rg-retailgrowth-dev -n rgai-dev-y1-p0249-d4e5ddbd \
            --src "$RUNNER_TEMP/p0249-y1-canary.zip" \
            --build-remote true -o none
      - name: Verify real cold readiness then 20 HTTP GETs; no Auth/tenant acceptance claims
        shell: bash
        run: |
          set -euo pipefail
          python3 -u ops/p0249_y1_canary_guard.py probe
      - name: Clear Azure login
        if: always()
        shell: bash
        run: az logout >/dev/null 2>&1 || true
