name: Feature3 synthetic clothing/model input package for Feature4+5

on:
  push:
    branches:
      - feat/feature3-share-real-demo-inputs-feature4-feature5-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-openvto-demo-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image decoder only
        run: python -m pip install Pillow==11.3.0
      - name: Fetch exact upstream synthetic model and garment demo bytes
        run: |
          set -euo pipefail
          python poster-engine/feature3_demo_inputs_v1.py --output-dir "$RUNNER_TEMP/feature3-inputs"
          cp tests/fixtures/feature3/OPENVTO_MIT_LICENSE.txt "$RUNNER_TEMP/feature3-inputs/LICENSE.txt"
      - name: Upload verified demo assets and SHA256 receipt to Features 4 and 5
        uses: actions/upload-artifact@v4
        with:
          name: feature3-verified-openvto-model-garment-v1
          path: ${{ runner.temp }}/feature3-inputs/
          retention-days: 7
          if-no-files-found: error
