name: RetailGrowthAI Part 1 CI

# Runs automatically for all Part 1 branches and PRs, plus manual reruns.
on:
  push:
    branches: [main, 'feat/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build + contract tests
    # Playwright 1.56.1 supports Ubuntu 24.04; ubuntu-latest moved to unsupported 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies (npm ci once lockfile exists)
        working-directory: frontend
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::frontend/package-lock.json not committed; using npm install until lockfile is reviewed"
            npm install --no-audit --no-fund
          fi
      - name: JavaScript tests
        working-directory: frontend
        run: npm test
      - name: Vite production build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for offline browser E2E (when present)
        if: ${{ hashFiles('frontend/e2e/package.json') != '' }}
        working-directory: frontend
        shell: bash
        run: |
          # Network mirrors occasionally stall; fail visibly, never skip browser tests.
          timeout --signal=TERM --kill-after=10s 180s npm install --prefix e2e --no-audit --no-fund
          # GitHub Ubuntu runners route apt via mirror+file:/etc/apt/apt-mirrors.txt.
          # An unhealthy Azure archive caused browser setup to reach the 420s
          # timeout in main run #39826247419. Switch the ephemeral runner to
          # Ubuntu's official archive before installing Playwright dependencies.
          # Do not disable Chromium installation or the actual browser tests.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' |
              sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          timeout --signal=TERM --kill-after=10s 420s ./e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Execute mocked React browser E2E (when present)
        if: ${{ hashFiles('frontend/e2e/package.json') != '' }}
        working-directory: frontend
        run: npm --prefix e2e test

  python:
    name: Python / uv + campaign contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: true
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Resolve and install AI-agent project
        run: |
          uv sync --project ai-agents
          if [ ! -f ai-agents/uv.lock ]; then
            echo "::warning::Commit ai-agents/uv.lock after dependency selection for reproducible CI"
          fi
      - name: Validate campaign contract and AI tests
        shell: bash
        run: |
          paths=(tests/contracts)
          if [ -d tests/ai ]; then paths+=(tests/ai); fi
          if [ -d ai-agents/tests ]; then paths+=(ai-agents/tests); fi
          if [ -d tests/integration ]; then paths+=(tests/integration); fi
          if [ -d tests/api ]; then paths+=(tests/api); fi
          if [ -d tests/reliability ]; then paths+=(tests/reliability); fi
          if [ -d tests/e2e ]; then paths+=(tests/e2e); fi
          if [ -d tests/infra ]; then paths+=(tests/infra); fi
          uv run --project ai-agents --with pytest --with "PyJWT[crypto]==2.10.1" -- python -m pytest -q "${paths[@]}"
      - name: Validate offline Azure packaging and approval gates (when present)
        shell: bash
        run: |
          if [ -f scripts/deploy/check.sh ]; then
            bash scripts/deploy/check.sh
          else
            echo "Azure packaging not yet integrated"
          fi

  video:
    name: FFmpeg codecs + renderer tests
    # Pin a verified media toolchain runner; ubuntu-latest upgraded FFmpeg mid-branch.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify FFmpeg availability (install only if missing)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            # A stalled package mirror must fail this job in a bounded time,
            # not strand CI indefinitely. Failures stay visible; never skip media tests.
            # GitHub's Ubuntu source often uses mirror+file:/etc/apt/apt-mirrors.txt.
            # Changing ubuntu.sources alone did not remove azure.archive.ubuntu.com
            # (post-merge main run #39810509471 failed after 480s of slow downloads).
            # Pin the ephemeral runner mirror list to the Ubuntu archive; keep
            # every H.264/AAC and full 30s render assertion mandatory below.
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' |
                sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
                /etc/apt/sources.list.d/ubuntu.sources
            fi
            timeout --signal=TERM --kill-after=10s 150s sudo apt-get \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=25 \
              -o Acquire::https::Timeout=25 update -qq
            timeout --signal=TERM --kill-after=10s 480s sudo env \
              DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=25 \
              -o Acquire::https::Timeout=25 install -y --no-install-recommends ffmpeg
          fi
          timeout --signal=TERM --kill-after=5s 20s ffmpeg -version | head -n 1
          timeout --signal=TERM --kill-after=5s 20s ffprobe -version | head -n 1
      - name: Encode and verify synthetic H.264/AAC sample
        shell: bash
        run: |
          mkdir -p ci-artifacts
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=360x640:rate=15:duration=2" \
            -f lavfi -i "sine=frequency=660:sample_rate=44100:duration=2" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -shortest ci-artifacts/ffmpeg-smoke.mp4
          python3 - <<'PY'
          import json
          import subprocess
          result = subprocess.check_output(
              ["ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", "ci-artifacts/ffmpeg-smoke.mp4"],
              text=True,
          )
          data = json.loads(result)
          codecs = {(stream["codec_type"], stream["codec_name"]) for stream in data["streams"]}
          assert ("video", "h264") in codecs, codecs
          assert ("audio", "aac") in codecs, codecs
          assert 1.8 <= float(data["format"]["duration"]) <= 2.2
          print("PASS: synthetic portrait H.264/AAC video plays for ~2 seconds")
          PY
      - name: Execute video-engine owned CI harness when implemented
        shell: bash
        run: |
          if [ -f video-engine/ci.sh ]; then
            bash video-engine/ci.sh
          elif find video-engine -type f ! -name '.gitkeep' ! -name 'README.md' | grep -q .; then
            echo "::error::Video engine code exists; add video-engine/ci.sh with real rendering tests"
            exit 1
          else
            echo "::notice::Renderer has not been implemented: only FFmpeg smoke validated"
          fi
      - name: Upload synthetic media evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-smoke
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 3

  security:
    name: Supabase isolation + authentication client tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check browser authentication client without secrets
        run: node --test tests/security/*.test.mjs
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: '2.84.2'
      - name: Initialize isolated Supabase configuration
        shell: bash
        run: |
          supabase --version
          # Local-only: never link this job to a hosted project or use cloud secrets.
          if [ ! -f supabase/config.toml ]; then
            supabase init --yes
          fi
      - name: Start disposable Supabase Postgres and apply migrations
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          for attempt in 1 2 3; do
            if supabase db start 2>&1 | tee "$log"; then
              exit 0
            fi
            # GitHub runner sometimes receives a transient GHCR registry
            # rate limit BEFORE SQL starts (e.g. main #39835674846).
            # Genuine schema/migration errors remain fatal, never ignored.
            if ! grep -Eiq 'failed to display json stream|error from registry|too many requests|rate limit|retry-after' "$log"; then
              echo "::error::Non-registry Supabase startup failure; fail closed."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Registry startup failed after 3 bounded attempts."
              exit 1
            fi
            echo "::warning::Transient Docker registry limit; retrying local Supabase startup."
            supabase stop --no-backup || true
            sleep "$((attempt * 12))"
            : > "$log"
          done
      - name: Install PostgreSQL command-line client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Assert cross-tenant data and private storage denial
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/security/rls_negative.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/security/storage_negative.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/security/draft_save_negative.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/security/upload_registration_negative.sql
          if [ -f tests/security/durable_recovery_negative.sql ]; then
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/security/durable_recovery_negative.sql
          fi
          if [ -f tests/security/subscription_quota_negative.sql ]; then
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/security/subscription_quota_negative.sql
          fi
          if [ -f tests/security/platform_admin_negative.sql ]; then
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/security/platform_admin_negative.sql
          fi
      - name: Stop isolated Supabase database
        if: always()
        shell: bash
        run: supabase stop --no-backup || true
