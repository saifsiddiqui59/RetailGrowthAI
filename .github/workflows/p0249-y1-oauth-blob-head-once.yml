name: "RetailGrowthAI #249 Y1 failed Blob direct OAuth HEAD (read only)"
# One-use protected DEV read-only OIDC diagnostic; NO configuration/data writes.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p0249-y1-oauth-blob-head-once.yml"
permissions:
  contents: read
concurrency:
  group: p0249-y1-blob-oauth-head-readonly
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      github.repository == 'saifsiddiqui59/RetailGrowthAI' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'ops(#249): probe isolated Y1 blob using OAuth HEAD')
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RGAI_DEV_EXPECTED_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify code and issue scoped read-only negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/infra -p 'test_p0249_y1_oauth_blob_head_readonly.py' -v
      - name: One pinned existing private Blob HEAD and original Y1 20 GETs
        shell: bash
        run: |
          set -euo pipefail
          python3 -u ops/p0249_y1_oauth_blob_head_readonly.py
      - name: End Azure OIDC
        if: always()
        run: az logout >/dev/null 2>&1 || true
