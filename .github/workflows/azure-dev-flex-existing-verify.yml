name: RetailGrowthAI DEV Flex hosting verification (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-dev-flex-existing-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'saifsiddiqui59/RetailGrowthAI'
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      id-token: write
      contents: read
    env:
      RG: rg-retailgrowth-dev
      SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      APP: rgai-dev-functions-d4e5ddbd
      PLAN: rgai-dev-flex
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check existing DEV Function App and exact host properties (NO Azure write)
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$SUB"
          az resource show -g "$RG" -n "$APP" --resource-type Microsoft.Web/sites \
            --api-version 2024-11-01 -o json > "$RUNNER_TEMP/app.json"
          az resource show -g "$RG" -n "$PLAN" --resource-type Microsoft.Web/serverfarms \
            --api-version 2024-04-01 -o json > "$RUNNER_TEMP/plan.json"
          python3 - "$RUNNER_TEMP/app.json" "$RUNNER_TEMP/plan.json" "$APP" "$PLAN" <<'PY'
          import json,sys
          app=json.load(open(sys.argv[1])); plan=json.load(open(sys.argv[2]))
          def region(v): return str(v or "").lower().replace(" ","")
          def data(t):
            return {"name":t.get("name"),"region":region(t.get("location")),
                    "kind":t.get("kind"),"sku":t.get("sku"),
                    "state":(t.get("properties") or {}).get("state")}
          print("Observed Function App:",data(app))
          print("Observed Flex plan:",data(plan))
          assert app.get("name","").lower()==sys.argv[3].lower()
          assert plan.get("name","").lower()==sys.argv[4].lower()
          assert region(app.get("location"))=="centralindia"
          assert region(plan.get("location"))=="centralindia"
          sku=plan.get("sku") or {}
          assert sku.get("name")=="FC1" and sku.get("tier")=="FlexConsumption"
          config=(app.get("properties") or {}).get("functionAppConfig") or {}
          runtime=config.get("runtime") or {}
          scale=config.get("scaleAndConcurrency") or {}
          print("Observed sanitized runtime:",runtime)
          print("Observed sanitized scale:",scale)
          assert runtime.get("name")=="python" and runtime.get("version")=="3.12"
          assert scale.get("instanceMemoryMB")==2048
          assert scale.get("maximumInstanceCount")==1
          print("PASS: existing Azure DEV Flex hosting real, Python 3.12, 2GiB, max one per function scaling group")
          PY
          echo "Hosting shell only: package/code and Supabase backend settings not deployed or verified."
      - name: Logout
        if: always()
        run: az logout >/dev/null 2>&1 || true
