name: RetailGrowthAI #249 CLI migration candidate (disposable source only)
# Coordinator-only branch utility: NO hosted DB, no Azure access, no secrets.
# The versioned filename must originate from pinned Supabase CLI.
on:
  push:
    branches: ['feat/p0-249-cli-generated-reel-rpc-migration-20261026']
    paths:
      - '.github/workflows/p0-249-cli-migration-candidate.yml'
      - 'experiments/secure-node-http/sql/request_reel_render_job.proposal.sql'
permissions:
  contents: read
jobs:
  cli-generated-candidate:
    if: github.repository == 'saifsiddiqui59/RetailGrowthAI' && github.ref == 'refs/heads/feat/p0-249-cli-generated-reel-rpc-migration-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: '2.84.2'
      - name: Generate local candidate with real pinned Supabase CLI and monotonic history gate
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/secure-node-http/sql/request_reel_render_job.proposal.sql
          max_version="$(find supabase/migrations -maxdepth 1 -type f -name '[0-9]*.sql' -printf '%f\n' | cut -d_ -f1 | sort | tail -1)"
          test "$max_version" = "20261026152000"
          echo "P0249_HIGHEST_CANONICAL_MIGRATION=$max_version"
          supabase --version
          supabase migration new p0_249_reel_render_intent
          candidate="$(find supabase/migrations -maxdepth 1 -type f -name '*_p0_249_reel_render_intent.sql' -printf '%f\n' | sort | tail -1)"
          test -n "$candidate"
          version="$(echo "$candidate" | cut -d_ -f1)"
          if ! [[ "$version" =~ ^[0-9]{14}$ ]]; then
            echo "::error::Supabase CLI did not create a canonical timestamp"
            exit 1
          fi
          echo "P0249_SUPABASE_CLI_GENERATED_FILENAME=$candidate"
          if [[ "$version" < "$max_version" || "$version" == "$max_version" ]]; then
            # Historical Feature2 schema is forward dated relative to runner UTC.
            # Do not alter migration versions or apply out-of-order hosted SQL.
            echo "P0249_GENERATION_NOT_YET_MONOTONIC=true"
            rm -- "supabase/migrations/$candidate"
            echo "P0249_SOURCE_ONLY_NO_APPLY=true"
            exit 0
          fi
          python3 - "$candidate" <<'PY'
          from pathlib import Path
          import sys
          candidate = Path("supabase/migrations") / sys.argv[1]
          proposal = Path("experiments/secure-node-http/sql/request_reel_render_job.proposal.sql").read_text()
          lines = proposal.splitlines(keepends=True)
          assert "SOURCE-ONLY" in lines[0] and "Offline disposable" in lines[1]
          replacement = (
              "-- RetailGrowthAI P0 #249: versioned caller-authorized Reel render-intent RPC.\n"
              "-- Generated by pinned Supabase CLI; reviewed source from original proposal.\n"
              "-- Do not apply on hosted DEV until separate controlled migration approval.\n"
              "-- Python Queue/FFmpeg and existing quota/outbox triggers remain unchanged.\n"
          )
          candidate.write_text(replacement + "".join(lines[4:]))
          assert candidate.stat().st_size > 9000
          print("P0249_REAL_CLI_VERSIONED_SQL_BYTES=", candidate.stat().st_size)
          PY
          sha256sum "supabase/migrations/$candidate"
          echo "P0249_MONOTONIC_VERSIONED_CANDIDATE_READY=true"
      - name: Upload CLI-generated SQL candidate for coordinator (not hosted)
        uses: actions/upload-artifact@v7
        with:
          name: p0249-cli-generated-reel-rpc-candidate
          path: supabase/migrations/*_p0_249_reel_render_intent.sql
          if-no-files-found: ignore
          retention-days: 2

# Monotonic migration version generation rechecked after 2026-10-26 15:20 UTC.
