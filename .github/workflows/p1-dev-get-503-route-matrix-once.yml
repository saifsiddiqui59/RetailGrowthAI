name: RetailGrowthAI DEV one-time P0 route and 503 origin matrix
# Single owner-scoped protected diagnostic. Does NOT change Azure/Supabase
# configuration, create accounts, spend on AI or run licensed media.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p1-dev-get-503-route-matrix-once.yml'
permissions:
  contents: read
concurrency:
  group: rgai-p1-dev-503-origin-matrix
  cancel-in-progress: false
jobs:
  matrix:
    if: >-
      github.repository == 'saifsiddiqui59/RetailGrowthAI' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'audit(dev): isolate RetailGrowthAI HTTP GET 503')
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: read
      id-token: write
    env:
      RG: rg-retailgrowth-dev
      APP: rgai-dev-functions-d4e5ddbd
      LAW: rgai-dev-law
      AZ_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify exact existing Central India DEV target and indexed GET functions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZ_SUB"
          test "$(az account show --query id -o tsv)" = "$AZ_SUB"
          az group show -n "$RG" -o json > "$RUNNER_TEMP/rg.json"
          python3 - "$RUNNER_TEMP/rg.json" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1]))
          tags={k.lower():str(v).lower() for k,v in (obj.get('tags') or {}).items()}
          assert obj['name']=='rg-retailgrowth-dev'
          assert obj.get('location','').replace(' ','').lower()=='centralindia'
          assert tags.get('app')=='retailgrowthai' and tags.get('environment')=='dev'
          print("P0_MATRIX_DEV_SCOPE_VERIFIED=true")
          PY
          test "$(az functionapp show -g "$RG" -n "$APP" --query name -o tsv)" = "$APP"
          az functionapp function list -g "$RG" -n "$APP" --query '[].name' -o tsv > "$RUNNER_TEMP/functions"
          for f in create_campaign read_campaign get_poster_draft read_poster_render get_render; do
            grep -q "/$f$" "$RUNNER_TEMP/functions" || { echo "P0_MISSING_FUNCTION=$f"; exit 3; }
          done
          echo "P0_MATRIX_HTTP_FUNCTIONS_INDEXED=true"
      - name: Query aggregate non-sensitive Function host errors and execution traces
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(az monitor log-analytics workspace show -g "$RG" -n "$LAW" --query customerId -o tsv)"
          test -n "$workspace"
          queries=(
            "AppExceptions | where TimeGenerated > ago(6h) | summarize n=count() by ExceptionType | order by n desc"
            "AppTraces | where TimeGenerated > ago(6h) and (Message contains 'Host' or Message contains 'worker' or Message contains 'language') | summarize n=count() by SeverityLevel | order by n desc"
            "AppRequests | where TimeGenerated > ago(6h) and Name contains 'read_campaign' | summarize n=count(), p95_ms=percentile(DurationMs,95) by ResultCode | order by n desc"
          )
          for idx in 0 1 2; do
            i=$((idx+1))
            if az monitor log-analytics query -w "$workspace" --analytics-query "${queries[$idx]}" -o json > "$RUNNER_TEMP/summary-$i.json" 2>/dev/null; then
              python3 - "$RUNNER_TEMP/summary-$i.json" "$i" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1]))
          if isinstance(value,dict): value=value.get('tables',[])
          print('P0_SAFE_AGGREGATE_'+sys.argv[2]+'='+json.dumps(value[:25] if isinstance(value,list) else [],sort_keys=True))
          PY
            else
              echo "P0_SAFE_AGGREGATE_${i}_UNAVAILABLE=true"
            fi
          done
          echo "P0_RAW_LOGS_TENANT_IDS_JWT_PAYLOADS_NOT_QUERIED=true"
      - name: Compare no-JWT HEAD/GET/POST routes and safe response headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          host="https://rgai-dev-functions-d4e5ddbd.azurewebsites.net"
          uuid="11111111-1111-4111-8111-111111111111"
          tests=[
              ("POST","/api/campaigns",401,18),
              ("GET",f"/api/campaigns/{uuid}",401,18),
              ("GET",f"/api/poster-drafts/{uuid}",401,18),
              ("GET",f"/api/poster-jobs/{uuid}",401,18),
              ("GET",f"/api/render-jobs/{uuid}",401,18),
              ("GET",f"/api/campaigns/{uuid}/days/{uuid}/posters",401,18),
              ("POST",f"/api/poster-drafts/{uuid}/select",401,18),
              ("GET","/api/p0-route-that-does-not-exist",404,18),
              # One long-probe confirms if the existing symptom is still a
              # real 60-second gateway response instead of a caller-side abort.
              ("GET",f"/api/campaigns/{uuid}",401,75),
          ]
          findings=[]
          for ordinal,(method,path,expected,limit) in enumerate(tests,1):
              args=["curl","-ksS","--connect-timeout","8","--max-time",str(limit),
                    "--dump-header","-","-o","/dev/null","-w","\n__METRICS__ %{http_code} %{time_total} %{time_starttransfer}"]
              if method=="POST": args.extend(["--data","{}","-H","Content-Type: application/json"])
              args.extend(["-X",method,host+path])
              try:
                  p=subprocess.run(args,capture_output=True,text=True,timeout=limit+6)
                  header_lines=p.stdout.splitlines()
                  metrics=next((x.split() for x in header_lines if x.startswith("__METRICS__")),[])
                  code=metrics[1] if len(metrics)>1 else "000"
                  elapsed=float(metrics[2]) if len(metrics)>2 else limit
                  app_marker=any(x.lower().startswith("x-request-id:") for x in header_lines)
                  content_type=next((x.split(":",1)[1].strip().split(";")[0] for x in header_lines
                                     if x.lower().startswith("content-type:")),"missing")
                  rc=p.returncode
              except subprocess.TimeoutExpired:
                  code,elapsed,app_marker,content_type,rc="000",float(limit),False,"timeout",124
              label=path.replace(uuid,"{uuid}")
              print(f"P0_MATRIX_{ordinal}={method} {label} code={code} seconds={elapsed:.3f} rc={rc} "
                    f"app_header={str(app_marker).lower()} content_type={content_type}",flush=True)
              findings.append((method,label,code,elapsed,app_marker,rc,expected))
          anomalies=[(m,l,c,round(t,2),marker) for m,l,c,t,marker,rc,expected in findings
                     if c!=str(expected) or rc!=0 or t>10]
          print("P0_MATRIX_ANOMALY_COUNT="+str(len(anomalies)))
          print("P0_MATRIX_ANOMALIES="+repr(anomalies))
          # A diagnostic success means all observations were captured. 503s
          # must not be mislabeled a repaired gateway or a clean acceptance.
          PY
      - name: Logout Azure
        if: always()
        run: az logout >/dev/null 2>&1 || true
