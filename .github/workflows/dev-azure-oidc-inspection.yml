name: RetailGrowthAI DEV Azure target inspection (read-only)

# On merging this workflow to main, perform ONE non-mutating Azure inventory.
# This is not a deploy trigger. Future runs must be explicitly dispatched.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dev-azure-oidc-inspection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-dev-target:
    name: Inspect exact DEV target without Azure writes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Federated Azure login with existing DEV credentials
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read-only resource group, SWA, and IAM inventory
        shell: bash
        env:
          EXPECTED_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          umask 077
          az account set --subscription "$EXPECTED_SUB"
          actual="$(az account show --query id -o tsv)"
          if [ "$actual" != "$EXPECTED_SUB" ]; then
            echo "::error::BLOCKED: wrong Azure subscription"; exit 4
          fi
          echo "PASS: Azure OIDC selected the expected DEV subscription (ID hidden)."
          group_file="$(mktemp)"
          trap 'rm -f "$group_file" "$group_file.matches" "$group_file.sites" "$group_file.roles" "$group_file.matches.missing-tags"' EXIT
          if az group list --subscription "$EXPECTED_SUB" --output json > "$group_file" 2>/dev/null; then
            echo "PASS: subscription resource-group read access."
          elif az group show --subscription "$EXPECTED_SUB" --name rg-retailgrowth-dev --output json > "$group_file" 2>/dev/null; then
            python3 -c 'import json,sys; json.dump([json.load(open(sys.argv[1]))],open(sys.argv[1]+".matches","w"))' "$group_file"
            mv "$group_file.matches" "$group_file"
            echo "PASS: exact-name DEV resource-group read access."
          else
            echo "::error::BLOCKED: Cannot read approved RetailGrowthAI DEV resource group."; exit 4
          fi
          python3 - "$group_file" "$group_file.matches" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          groups = data if isinstance(data,list) else [data]
          approved=[]
          candidates=[]
          for rg in groups:
              tags={str(k).lower():str(v).lower() for k,v in (rg.get("tags") or {}).items()}
              name=str(rg.get("name",""))
              loc=str(rg.get("location","")).lower().replace(" ","")
              if ("retailgrowth" in name.lower() or "rgai" in name.lower()
                  or tags.get("app")=="retailgrowthai"):
                  candidates.append({"name":name,"location":loc,
                                     "app_tag":tags.get("app","(missing)"),
                                     "env_tag":tags.get("environment","(missing)")})
              if (tags.get("app")=="retailgrowthai" and tags.get("environment")=="dev"
                  and loc=="centralindia" and name.lower().startswith("rg-")
                  and "retailgrowth" in name.lower()):
                  approved.append({"name":name, "location":loc, "id":rg.get("id")})
          print("Count of RGs visible to DEV identity:",len(groups))
          print("RetailGrowthAI-named/tagged RG candidates:",len(candidates))
          for candidate in candidates:
              print("CANDIDATE:",candidate["name"], "| region:",candidate["location"],
                    "| app tag:",candidate["app_tag"], "| environment tag:",candidate["env_tag"])
          json.dump(approved,open(sys.argv[2],"w"))
          print("Matching isolated, tagged Central India RetailGrowthAI DEV RG count:",len(approved))
          for group in approved:
              print("DEV RG:",group["name"],"| region:",group["location"])
          if len(approved)!=1:
              # Read-only diagnostic exception: inspect the exact pre-agreed RG
              # without treating missing ownership tags as deployment approval.
              exact=[rg for rg in groups
                     if str(rg.get("name","")).lower()=="rg-retailgrowth-dev"
                     and str(rg.get("location","")).lower().replace(" ","")=="centralindia"]
              if len(exact)!=1 or len(approved)>1:
                  print("BLOCKED: no unambiguous dedicated Central India RG; no resources changed.")
                  sys.exit(3)
              approved=[{"name":exact[0]["name"],"location":"centralindia","id":exact[0]["id"]}]
              json.dump(approved,open(sys.argv[2],"w"))
              open(sys.argv[2]+".missing-tags","w").write("yes")
              print("READ-ONLY EXCEPTION: exact dedicated RG found, missing required tags. Inspecting IAM and SWA without changing resources.")
          PY
          rg="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))[0]["name"])' "$group_file.matches")"
          rg_id="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))[0]["id"])' "$group_file.matches")"
          echo "Inspecting Static Web Apps in exactly one approved DEV RG..."
          if az staticwebapp list --resource-group "$rg" --subscription "$EXPECTED_SUB" --output json > "$group_file.sites"; then
            python3 - "$group_file.sites" <<'PY'
          import json,sys
          sites=json.load(open(sys.argv[1]))
          print("Static Web Apps in scoped DEV RG:",len(sites))
          for site in sites:
              sku=site.get("sku") or {}
              print("Site:",site.get("name"),"| tier:",sku.get("name","unknown"),
                    "| status:",site.get("provisioningState","unknown"),
                    "| verified ARM hostname:",site.get("defaultHostname") or "none")
          PY
          else
            echo "BLOCKED: No permission to enumerate DEV Static Web Apps."
          fi
          echo "Inspecting direct service-principal IAM (no role changes)..."
          if object_id="$(az ad sp show --id "$EXPECTED_CLIENT_ID" --query id -o tsv 2>/dev/null)" && [ -n "$object_id" ]; then
            if az role assignment list --assignee-object-id "$object_id" --scope "$rg_id" --all --include-inherited --output json > "$group_file.roles" 2>/dev/null; then
              python3 - "$group_file.roles" "$rg_id" <<'PY'
          import json,sys
          roles=json.load(open(sys.argv[1]))
          rgid=sys.argv[2].lower()
          for r in roles:
              scope=str(r.get("scope") or "").lower()
              role=str(r.get("roleDefinitionName") or "")
              kind="EXACT_RG" if scope==rgid else "INHERITED"
              print("IAM:",kind,role)
          has_direct=any(str(r.get("scope") or "").lower()==rgid and
                         str(r.get("roleDefinitionName") or "").lower()=="contributor" for r in roles)
          print("DIRECT_RG_CONTRIBUTOR_VERIFIED:",str(has_direct).lower())
          PY
            else
              echo "BLOCKED: Could not list scoped IAM roles; a login alone is not deploy permission."
            fi
          else
            echo "BLOCKED: Principal object ID is not readable via Entra; cannot verify IAM."
          fi
          if [ -f "$group_file.matches.missing-tags" ]; then
            echo "::error::BLOCKED FOR DEPLOY: rg-retailgrowth-dev requires app=RetailGrowthAI and environment=dev tags. IAM and SWA inventory above is read-only."
            exit 3
          fi
          echo "Azure inventory complete: READ-ONLY. No resource, token or secret was created."
      - name: Remove transient Azure credentials
        if: always()
        shell: bash
        run: az logout >/dev/null 2>&1 || true
