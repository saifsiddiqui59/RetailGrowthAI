name: RetailGrowthAI protected reusable F4 DEV identities and isolated shops
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Explicit persistent synthetic test fixtures only
        required: true
        type: choice
        options: [NO, OWNER-AUTHORIZED-REUSABLE-DEV-F4-FIXTURES]
permissions:
  contents: read
concurrency:
  group: rgai-dev-live-canary
  cancel-in-progress: false
jobs:
  provision:
    if: >-
      github.repository == 'saifsiddiqui59/RetailGrowthAI' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'OWNER-AUTHORIZED-REUSABLE-DEV-F4-FIXTURES'
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run no-network fixture safety tests
        run: python3 -m unittest discover -s tests/infra -p test_f4_reusable_dev_fixtures.py -v
      - name: Provision or reuse only marked test identities and normal signed shops
        env:
          RGAI_REUSABLE_FIXTURES_CONFIRM: ${{ inputs.confirm }}
          RGAI_DEV_SERVICE_KEY: ${{ secrets.RETAIL_SUPABASE_SERVICE_ROLE_KEY }}
          RGAI_DEV_PUBLISHABLE_KEY: sb_publishable_tEqNinZfiLzrAyF4E1pAeQ_vZRvJYjq
        run: python3 -u tests/e2e/f4_reusable_dev_fixtures.py
