name: RetailGrowthAI dependency coordinator
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["RetailGrowthAI Part 1 CI"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "coordination/**"
      - "scripts/coordination/**"
      - ".github/workflows/retailgrowthai-dependency-coordinator.yml"
  pull_request:
    branches: [main]
    paths:
      - "coordination/**"
      - "scripts/coordination/**"
      - "tests/contracts/test_dependency_coordinator.py"
      - "tests/contracts/test_feature_inventory.py"
      - "tests/contracts/test_task_status.py"
      - "tests/contracts/test_feature_references.py"
      - "tests/contracts/test_dev_test_user_provisioning.py"
      - ".github/workflows/retailgrowthai-dependency-coordinator.yml"

concurrency:
  group: retailgrowthai-dependency-coordinator
  cancel-in-progress: false

jobs:
  validate:
    name: Validate registry and offline dependency tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/coordination/resolve_dependencies.py --validate-only
      - run: python scripts/coordination/task_status.py --validate-only
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/contracts/test_dependency_coordinator.py tests/contracts/test_feature_inventory.py tests/contracts/test_task_status.py tests/contracts/test_feature_references.py tests/contracts/test_dev_test_user_provisioning.py

  coordinate:
    name: Verify GitHub evidence and prepare readiness report
    needs: validate
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve verified dependency gates without issue dispatch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/coordination/resolve_dependencies.py --report-dir coordination-reports
      - name: Refresh evidence-verified feature task-manager status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/coordination/task_status.py --output-dir coordination-reports
      - name: Publish dependency report to workflow summary
        if: always()
        run: |
          if test -f coordination-reports/status.md; then cat coordination-reports/status.md >> "$GITHUB_STEP_SUMMARY"; fi
          if test -f coordination-reports/task-status.md; then cat coordination-reports/task-status.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-readiness-report
          path: coordination-reports/
          if-no-files-found: ignore
          retention-days: 7
