name: RetailGrowthAI DEV Supabase passwordless CLI preflight
# This workflow never applies SQL. Uses a project-scoped Supabase Management
# API token to get a short-lived CLI login role, not the permanent DB password.
# Does NOT use the WineShopPOS or GenAI-Galaxy projects.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dev-supabase-passwordless-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retailgrowth-dev-db-preflight-token
  cancel-in-progress: false

jobs:
  check:
    name: Verify RetailGrowthAI-only OAuth/PAT-linked migrations
    if: github.repository == 'saifsiddiqui59/RetailGrowthAI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    env:
      # Set as a GitHub DEV ENVIRONMENT secret. Never print or commit token.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.RETAIL_SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jeearzffnjbvghwjjjrf
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check protected project-scoped PAT availability
        id: token
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "DEV_PAT_PRESENT: configured (value hidden)"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEV_PAT_MISSING: add RETAIL_SUPABASE_ACCESS_TOKEN under GitHub Environments > dev > secrets, restricted to RetailGrowthAI"
            echo "No permanent Postgres database password is required by this route."
          fi
      - uses: supabase/setup-cli@v3
        if: steps.token.outputs.present == 'true'
        with:
          version: '2.121.0'
      - name: Verify exactly ten canonical timestamped files and no role-reset problem
        if: steps.token.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase link --help > "$RUNNER_TEMP/link-help"
          supabase db push --help > "$RUNNER_TEMP/db-push-help"
          grep -q -- '--project-ref' "$RUNNER_TEMP/link-help"
          grep -q -- '--linked' "$RUNNER_TEMP/db-push-help"
          grep -q -- '--dry-run' "$RUNNER_TEMP/db-push-help"
          python3 - <<'PY'
          from pathlib import Path
          import re
          got=[p.name for p in sorted(Path('supabase/migrations').glob('*.sql'))]
          expected=[
            '20261022085124_p1_foundation.sql',
            '20261022085132_p1_private_media.sql',
            '20261022085503_p1_security_hardening.sql',
            '20261022100400_p1_durable_planning.sql',
            '20261022101800_p1_render_claim.sql',
            '20261022162000_p1_draft_save.sql',
            '20261022173000_p1_private_upload_registration.sql',
            '20261022180000_p1_dev_media_integrity.sql',
            '20261022205000_p1_worker_execution_budget.sql',
            '20261022220000_p1_durable_recovery.sql'
          ]
          assert got==expected,'STOP: unexpected migration version/name drift'
          for fn in got[3:]:
            sql=Path('supabase/migrations',fn).read_text()
            if re.search(r'^\s*(?:set|reset)\s+(?:local\s+)?role\b',sql,re.I|re.M):
              raise SystemExit('STOP: temporary CLI login-role cannot safely process SQL SET/RESET ROLE')
          print('CANONICAL_FILES: exact 10 expected versions; no SET/RESET ROLE in pending migrations')
          PY
      - name: Link ONLY RetailGrowthAI project without PostgreSQL password
        if: steps.token.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'jeearzffnjbvghwjjjrf'
          test -z "${SUPABASE_DB_PASSWORD:-}"
          # Supabase init affects only this disposable GitHub runner.
          if [ ! -f supabase/config.toml ]; then
            supabase init --yes > "$RUNNER_TEMP/init.log" 2>&1 || {
              echo "::error::CLI_CONFIG_INIT_FAILED: check the initialised directory"; exit 3;
            }
          fi
          # Empty answer explicitly skips the optional DB password prompt.
          if ! (printf '\n' | timeout 120s supabase link --project-ref "$PROJECT_REF") \
              > "$RUNNER_TEMP/link.stdout" 2> "$RUNNER_TEMP/link.stderr"; then
            echo "::error::CLI_PROJECT_LINK_FAILED: check project-scoped token access and Project Settings/API Keys/API Key Secrets read permissions"
            exit 3
          fi
          test -f supabase/.temp/project-ref || {
            echo "::error::CLI_PROJECT_REF_MISSING"; exit 3;
          }
          test "$(cat supabase/.temp/project-ref)" = "$PROJECT_REF" || {
            echo "::error::WRONG_SUPABASE_PROJECT"; exit 3;
          }
          echo "PASSWORDLESS_PROJECT_LINK: PASS (exact RetailGrowthAI project)"
      - name: Read linked migration history and dry-run seven pending files (NO DDL)
        if: steps.token.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout 120s supabase db push --linked --dry-run \
            > "$RUNNER_TEMP/dryrun.stdout" 2> "$RUNNER_TEMP/dryrun.stderr"; then
            echo "::error::PASSWORDLESS_DRY_RUN_FAILED: check temporary login-role scope/CLI permissions and remote schema drift"
            exit 3
          fi
          python3 - "$RUNNER_TEMP/dryrun.stdout" "$RUNNER_TEMP/dryrun.stderr" <<'PY'
          from pathlib import Path
          import sys
          text='\n'.join(Path(x).read_text(errors='replace') for x in sys.argv[1:])
          expected=[
            '20261022100400','20261022101800','20261022162000',
            '20261022173000','20261022180000','20261022205000','20261022220000'
          ]
          missing=[v for v in expected if v not in text]
          if missing:
            raise SystemExit('STOP: official CLI dry-run did not confirm all 7 pending original timestamp versions')
          print('PASSWORDLESS_DRY_RUN: PASS, 7 original pending migration IDs visible')
          print('SQL_APPLIED: none (CLI --dry-run only)')
          PY
