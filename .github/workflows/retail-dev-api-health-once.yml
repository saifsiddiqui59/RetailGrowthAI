name: RetailGrowthAI DEV read-only API + planner trace health
on:
  push:
    branches: [main]
    paths: [.github/workflows/retail-dev-api-health-once.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'saifsiddiqui59/RetailGrowthAI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check exact RetailGrowthAI DEV Functions and App Insights only
        shell: bash
        env:
          AZ_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          rg=rg-retailgrowth-dev
          name=rgai-dev-functions-d4e5ddbd
          test "$(az account show --query id -o tsv)" = "$AZ_SUB"
          test "$(az group show -n "$rg" --query name -o tsv)" = "$rg"
          az functionapp show -n "$name" -g "$rg" -o json > "$RUNNER_TEMP/app.json"
          python3 - "$RUNNER_TEMP/app.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['name']=='rgai-dev-functions-d4e5ddbd'
          print('FUNCTION_RUNTIME_STATE',j.get('state','unknown'))
          PY
          az functionapp function list -n "$name" -g "$rg" --query '[].name' -o tsv > "$RUNNER_TEMP/functions"
          echo "INDEXED_FUNCTION_COUNT=$(wc -l < "$RUNNER_TEMP/functions")"
          az functionapp config appsettings list -n "$name" -g "$rg" \
            --query '[].name' -o tsv > "$RUNNER_TEMP/env_names"
          for key in RETAIL_FOUNDRY_ENDPOINT RETAIL_FOUNDRY_DEPLOYMENT RETAIL_FOUNDRY_API_KEY RETAIL_SUPABASE_SERVICE_ROLE_KEY RETAIL_STORAGE APPLICATIONINSIGHTS_CONNECTION_STRING; do
            grep -Fxq "$key" "$RUNNER_TEMP/env_names" || { echo "MISSING_SETTING_NAME=$key"; exit 3; }
          done
          echo 'PASS required server-only setting NAMES present, values NEVER inspected/logged'
      - name: Query only aggregated recent API status, worker events and exceptions
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(az monitor log-analytics workspace show -g rg-retailgrowth-dev -n rgai-dev-law --query customerId -o tsv)"
          test -n "$workspace"
          queries=(
            "AppRequests | where TimeGenerated > ago(90m) | summarize n=count() by ResultCode,Success | order by n desc"
            "AppTraces | where TimeGenerated > ago(90m) | summarize http=sum(toint(Message contains 'http.request')), planner=sum(toint(Message contains 'planner.')), foundry=sum(toint(Message contains 'foundry.'))"
            "AppExceptions | where TimeGenerated > ago(90m) | summarize exception_count=count()"
            "AppDependencies | where TimeGenerated > ago(90m) | summarize n=count() by Success,ResultCode | order by n desc"
          )
          i=0
          for query in "${queries[@]}"; do
            i=$((i+1))
            if az monitor log-analytics query -w "$workspace" --analytics-query "$query" -o json > "$RUNNER_TEMP/query-$i.json"; then
              echo "DIAGNOSTIC_QUERY_$i"
              python3 - "$RUNNER_TEMP/query-$i.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          if isinstance(rows,list): print(json.dumps(rows[:25],sort_keys=True))
          elif isinstance(rows,dict): print('RESULT_TABLES',len(rows.get('tables',[])))
          else: print('NO_AGGREGATE')
          PY
            else
              echo "DIAGNOSTIC_QUERY_${i}_UNAVAILABLE"
            fi
          done
          echo 'No raw prompts, user identifiers, response bodies, trace IDs, JWT or keys were queried.'
      - name: Azure logout
        if: always()
        run: az logout >/dev/null 2>&1 || true
