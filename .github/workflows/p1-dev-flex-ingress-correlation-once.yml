name: RetailGrowthAI DEV one-shot Flex HTTP host scale correlation
# One-shot existing DEV read-only diagnostics; no configuration, resource or tenant changes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p1-dev-flex-ingress-correlation-once.yml'
permissions:
  contents: read
concurrency:
  group: rgai-dev-flex-ingress-correlation
  cancel-in-progress: false
jobs:
  correlate:
    if: >-
      github.repository == 'saifsiddiqui59/RetailGrowthAI' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'audit(dev): correlate RetailGrowthAI Flex HTTP host and scale')
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read-only bounded HTTP and existing Flex platform correlation
        shell: bash
        env:
          RGAI_DEV_EXPECTED_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          python3 -u ops/flex_ingress_correlation.py
      - name: End existing DEV Azure read-only session
        if: always()
        run: az logout >/dev/null 2>&1 || true
