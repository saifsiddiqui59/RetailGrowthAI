name: "RetailGrowthAI #249 Y1 38-route HTTP source artifact (NO Azure release)"
# Reviewable release-preparation build only. NEVER deploy/modify Azure here.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p0249-y1-38-http-source-artifact.yml
      - ops/p0249-y1-cutover/**
      - azure-functions/campaign-api/**
      - scripts/deploy/package.py
      - tests/infra/test_p0249_y1_full_http_only.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0249-y1-offline-source-package
  cancel-in-progress: true

jobs:
  source-artifact:
    name: Exact 38 HTTP / 46 staged worker offline artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fail closed on original source registration drift
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/p0249-y1-cutover/prepare_http_only.py --check
          python3 -m unittest discover -s tests/infra -p 'test_p0249_y1_full_http_only.py' -v
          python3 scripts/deploy/package.py --check
      - name: Build reviewed original ZIP then stage classic Y1 HTTP-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/media" "$RUNNER_TEMP/release"
          IMAGE="mwader/static-ffmpeg@sha256:f5d100184884eb3e82b0eb14bb5ebf98da99826ac824989720297fb9ef21c822"
          docker pull "$IMAGE"
          cid="$(docker create "$IMAGE" -version)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/ffmpeg" "$RUNNER_TEMP/media/ffmpeg"
          docker cp "$cid:/ffprobe" "$RUNNER_TEMP/media/ffprobe"
          chmod 755 "$RUNNER_TEMP/media/ffmpeg" "$RUNNER_TEMP/media/ffprobe"
          cat > "$RUNNER_TEMP/media/THIRD_PARTY_NOTICES.txt" <<'NOTICE'
          FFmpeg and ffprobe: static Linux x86_64 GPL distribution, libx264 and AAC.
          Corresponding source and build instructions: https://github.com/wader/static-ffmpeg
          Distribution content digest: sha256:f5d100184884eb3e82b0eb14bb5ebf98da99826ac824989720297fb9ef21c822
          License and redistribution terms: https://ffmpeg.org/legal.html
          NOTICE
          python3 scripts/deploy/package.py --ffmpeg-dir "$RUNNER_TEMP/media" \
            --output "$RUNNER_TEMP/release/original-verified-flex.zip"
          python3 scripts/deploy/package.py \
            --verify-zip "$RUNNER_TEMP/release/original-verified-flex.zip"
          python3 ops/p0249-y1-cutover/prepare_http_only.py \
            --source-zip "$RUNNER_TEMP/release/original-verified-flex.zip" \
            --output-zip "$RUNNER_TEMP/release/y1-38-http-only.zip" \
            --mode http-only
          python3 ops/p0249-y1-cutover/prepare_http_only.py \
            --source-zip "$RUNNER_TEMP/release/original-verified-flex.zip" \
            --output-zip "$RUNNER_TEMP/release/y1-46-short-worker-stage.zip" \
            --mode http-with-short-workers
          python3 - "$RUNNER_TEMP/release/y1-38-http-only.zip" \
                      "$RUNNER_TEMP/release/y1-46-short-worker-stage.zip" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          from zipfile import ZipFile
          spec = importlib.util.spec_from_file_location(
              "p0249_http_only_converter",
              "ops/p0249-y1-cutover/prepare_http_only.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          expected_http = {name: "route" for name in mod.HTTP | {"p0249_health"}}
          expected_short = dict(expected_http)
          original_methods, _ = mod.registrations(mod.ORIGINAL.read_bytes())
          expected_short.update({
              name: original_methods[name] for name in mod.WORKERS
              if name != "render_campaign_reel"
          })
          for path, expected, label in (
              (sys.argv[1], expected_http, "HTTP_ONLY"),
              (sys.argv[2], expected_short, "SHORT_WORKERS_INERT"),
          ):
              with ZipFile(path) as archive:
                  assert archive.testzip() is None
                  actual, _ = mod.registrations(archive.read(mod.MEMBER))
                  assert actual == expected, (label, len(actual))
                  assert len(actual) == (38 if label == "HTTP_ONLY" else 46)
                  assert "render_campaign_reel" not in actual
                  assert len(archive.infolist()) <= 120
              print(f"P0249_Y1_{label}_PACKAGE_EXACT={len(actual)}", flush=True)
          print("P0249_Y1_PACKAGES=SOURCE_VERIFIED_NOT_DEPLOYED", flush=True)
          PY
          sha256sum "$RUNNER_TEMP/release/y1-38-http-only.zip"
          sha256sum "$RUNNER_TEMP/release/y1-46-short-worker-stage.zip"
      - name: Retain only the zero-consumer 38-route source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: p0249-y1-http-only-38-review-candidate
          path: ${{ runner.temp }}/release/y1-38-http-only.zip
          if-no-files-found: error
          retention-days: 1
      - name: State release boundary
        run: |
          echo 'P0249_Y1_OFFLINE_SOURCE_ARTIFACT_ONLY=PASS'
          echo 'P0249_Y1_HOSTED_DEPLOYMENT=NOT_ATTEMPTED'
          echo 'P0249_Y1_FLEX_STOP=FORBIDDEN'
