name: RetailGrowthAI DEV Application Insights trace-ingestion proof (read only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/retail-dev-trace-ingestion-proof-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'saifsiddiqui59/RetailGrowthAI' && github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Query only dedicated DEV workspace without exporting raw traces
        shell: bash
        run: |
          set -euo pipefail
          RG=rg-retailgrowth-dev
          APP=rgai-dev-appinsights
          LAW=rgai-dev-law
          test "$(az functionapp show -g "$RG" -n rgai-dev-functions-d4e5ddbd --query name -o tsv)" = rgai-dev-functions-d4e5ddbd
          customer="$(az monitor log-analytics workspace show -g "$RG" -n "$LAW" --query customerId -o tsv)"
          test -n "$customer"
          # Workspace ingestion may be delayed; do not infer from HTTP success alone.
          for attempt in $(seq 1 5); do
            az monitor log-analytics query -w "$customer" \
              --analytics-query "AppTraces | where TimeGenerated > ago(45m) | where Message contains 'http.request' | summarize event_count=count()" \
              -o json > "$RUNNER_TEMP/summary.json" || true
            if python3 - "$RUNNER_TEMP/summary.json" <<'PY'
          import json,sys
          try:
            data=json.load(open(sys.argv[1]))
            count=sum(int(x.get("event_count",0)) for x in (data if isinstance(data,list) else data.get("tables",[])))
          except Exception:
            count=0
          print("SAFE_HTTP_TRACE_COUNT",count)
          sys.exit(0 if count>0 else 1)
          PY
            then echo 'PASS: fresh RetailGrowthAI Functions http.request telemetry ingested in dedicated workspace'; exit 0; fi
            sleep 20
          done
          echo 'UNVERIFIED: No fresh custom trace ingested or read query unavailable; inspect Application Insights separately.'
          exit 3
      - name: Logout
        if: always()
        run: az logout >/dev/null 2>&1 || true
